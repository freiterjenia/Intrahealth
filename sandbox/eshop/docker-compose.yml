services:
  sandbox:
    build:
      context: ../..
      dockerfile: sandbox/eshop/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - UseOnlyInMemoryDatabase=false
      - ConnectionStrings__seq=http://localhost:5341
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5106:8080"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=@someThingComplicated1234
      - MSSQL_PID=Developer
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "@someThingComplicated1234" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1"
