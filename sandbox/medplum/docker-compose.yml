services:
  sandbox:
    build:
      context: ../..
      dockerfile: sandbox/medplum/Dockerfile
    environment:
      - MEDPLUM_PORT=8103
      - MEDPLUM_BASE_URL=http://localhost:8103/
      - MEDPLUM_DATABASE_HOST=postgres
      - MEDPLUM_DATABASE_PORT=5432
      - MEDPLUM_DATABASE_DBNAME=medplum
      - MEDPLUM_DATABASE_USERNAME=medplum
      - MEDPLUM_DATABASE_PASSWORD=medplum
      - MEDPLUM_DATABASE_RUN_MIGRATIONS=true
      - MEDPLUM_REDIS_HOST=redis
      - MEDPLUM_REDIS_PORT=6379
      - MEDPLUM_REDIS_PASSWORD=medplum
      - MEDPLUM_BINARY_STORAGE=file:./binary/
      - MEDPLUM_ALLOWED_ORIGINS=*
      - NODE_ENV=development
      # Test-specific overrides
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8103:8103"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=medplum
      - POSTGRES_PASSWORD=medplum
      - POSTGRES_DB=medplum
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  redis:
    image: redis:7
    command: redis-server --requirepass medplum
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "medplum", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
